<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Multi-Party Classroom</title>
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0f172a; 
            color: #f8fafc; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        .header { 
            height: 60px; 
            background: rgba(30, 41, 59, 0.8); 
            backdrop-filter: blur(12px);
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 20px; 
            border-bottom: 1px solid #334155; 
            z-index: 20;
        }
        .logo { font-size: 18px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
        .room-info { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #94a3b8; }
        .status-badge { display: flex; align-items: center; gap: 6px; background: #1e293b; padding: 5px 12px; border-radius: 20px; border: 1px solid #334155; }
        .dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; }
        .dot.online { background: #22c55e; }

        /* MAIN CONTENT AREA */
        .container {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* VIDEO GRID DESIGN */
        .video-grid {
            flex: 1;
            padding: 16px;
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            grid-auto-rows: minmax(200px, 1fr);
            align-content: center;
            justify-content: center;
            overflow-y: auto;
        }

        .video-card {
            position: relative;
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #0f172a;
        }

        .video-card.local video {
            transform: scaleX(-1);
        }

        .avatar-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            color: #64748b;
            z-index: 1;
            gap: 10px;
        }

        .avatar-placeholder i { font-size: 50px; }

        .participant-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .hand-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #f59e0b;
            color: #fff;
            padding: 8px;
            border-radius: 50%;
            display: none;
            z-index: 3;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }

        /* SIDEBAR CHAT PANEL */
        .chat-sidebar {
            width: 320px;
            background: #1e293b;
            border-left: 1px solid #334155;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 15;
            transform: translateX(100%);
        }

        .chat-sidebar.open {
            transform: translateX(0);
            position: relative;
        }

        .chat-header {
            padding: 16px;
            border-bottom: 1px solid #334155;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg-box {
            background: #0f172a;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            border: 1px solid #334155;
        }

        .msg-sender { font-weight: 600; font-size: 11px; color: #38bdf8; margin-bottom: 4px; }

        .chat-input-area {
            padding: 12px;
            border-top: 1px solid #334155;
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            outline: none;
            font-size: 13px;
        }

        .chat-input-area button {
            background: #0284c7;
            border: none;
            color: #fff;
            padding: 0 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* FLOATING CONTROLS TOOLBAR */
        .controls-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            padding: 10px 20px;
            border-radius: 40px;
            display: flex;
            gap: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 25;
        }

        .btn-ctrl {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: #334155;
            color: #f8fafc;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-ctrl:hover { background: #475569; transform: translateY(-2px); }
        .btn-ctrl.off { background: #ef4444; color: white; }
        .btn-ctrl.active { background: #0284c7; color: white; }
        .btn-ctrl.danger { background: #dc2626; color: white; }

        /* JOIN OVERLAY MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .modal-card h2 { margin-bottom: 8px; color: #38bdf8; }
        .modal-card p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
        .modal-card input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            margin-bottom: 16px;
            outline: none;
            text-align: center;
            font-size: 14px;
        }
        .btn-join {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }
        .btn-join:hover { background: #0369a1; }
    </style>
</head>
<body>

    <!-- MODAL FOR USER JOIN -->
    <div id="joinModal" class="modal-overlay">
        <div class="modal-card">
            <h2>Live Classroom</h2>
            <p>Ingiza jina lako ili kujiunga kwenye mkutano</p>
            <input type="text" id="usernameInput" placeholder="Jina yako mf. Elia Mhapa" autofocus />
            <button id="joinBtn" class="btn-join"><i class="fa-solid fa-right-to-bracket"></i> Jiunge Sasa</button>
        </div>
    </div>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>Live Classroom</span>
        </div>
        <div class="room-info">
            <span>Room: <b id="roomLabel">...</b></span>
            <div class="status-badge">
                <span id="statusDot" class="dot"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </div>
    </header>

    <!-- CONTAINER AREA -->
    <div class="container">
        <!-- VIDEO GRID -->
        <div id="videoGrid" class="video-grid">
            <!-- Local User Tile -->
            <div id="localTile" class="video-card local">
                <div id="localAvatar" class="avatar-placeholder">
                    <i class="fa-solid fa-user-slash"></i>
                    <span>Kamera Iko Off</span>
                </div>
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="participant-label">
                    <i class="fa-solid fa-user"></i>
                    <span id="localNameLabel">Wewe</span>
                </div>
                <div id="localHand" class="hand-badge">
                    <i class="fa-solid fa-hand"></i>
                </div>
            </div>
        </div>

        <!-- CHAT SIDEBAR -->
        <div id="chatSidebar" class="chat-sidebar">
            <div class="chat-header">
                <span><i class="fa-solid fa-comments"></i> In-Meeting Chat</span>
                <i id="closeChatBtn" class="fa-solid fa-xmark" style="cursor: pointer;"></i>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="msgInput" placeholder="Andika ujumbe hapa..." />
                <button id="sendMsgBtn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- FLOATING CONTROLS -->
    <div class="controls-bar">
        <button id="micBtn" class="btn-ctrl off" title="Washa/Zima Mic"><i class="fa-solid fa-microphone-slash"></i></button>
        <button id="cameraBtn" class="btn-ctrl off" title="Washa/Zima Kamera"><i class="fa-solid fa-video-slash"></i></button>
        <button id="handBtn" class="btn-ctrl" title="Nyosha Mkono"><i class="fa-solid fa-hand"></i></button>
        <button id="chatBtn" class="btn-ctrl" title="Fungua Chat"><i class="fa-solid fa-message"></i></button>
        <button id="endBtn" class="btn-ctrl danger" title="Ondoka kwenye Mkutano"><i class="fa-solid fa-phone-slash"></i></button>
    </div>

<script>
    const localVideo = document.getElementById("localVideo");
    const localAvatar = document.getElementById("localAvatar");
    const localNameLabel = document.getElementById("localNameLabel");
    const localHand = document.getElementById("localHand");
    const videoGrid = document.getElementById("videoGrid");
    
    const micBtn = document.getElementById("micBtn");
    const cameraBtn = document.getElementById("cameraBtn");
    const handBtn = document.getElementById("handBtn");
    const chatBtn = document.getElementById("chatBtn");
    const endBtn = document.getElementById("endBtn");
    
    const joinModal = document.getElementById("joinModal");
    const joinBtn = document.getElementById("joinBtn");
    const usernameInput = document.getElementById("usernameInput");
    
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const roomLabel = document.getElementById("roomLabel");

    const chatSidebar = document.getElementById("chatSidebar");
    const closeChatBtn = document.getElementById("closeChatBtn");
    const chatMessages = document.getElementById("chatMessages");
    const msgInput = document.getElementById("msgInput");
    const sendMsgBtn = document.getElementById("sendMsgBtn");

    const params = new URLSearchParams(window.location.search);
    const room = params.get("room") || "class1";
    roomLabel.textContent = room;

    const userId = "user_" + Math.random().toString(36).substr(2, 9);
    let userName = "Participant";

    let socket = null;
    let localStream = null;
    let isCameraOn = false;
    let isMicOn = false;
    let isHandRaised = false;

    // WebRTC Peer Connections map: targetUserId -> RTCPeerConnection
    const peerConnections = new Map();

    const rtcConfig = {
        iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" }
        ]
    };

    // 1. ANZA AUDIO TRACE/STREAM (OFF BY DEFAULT CAMERA)
    async function initMedia() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: true
            });

            // Weka Mute Audio na Disable Video kwa kuanzia (Off by Default)
            localStream.getAudioTracks().forEach(t => t.enabled = false);
            localStream.getVideoTracks().forEach(t => t.enabled = false);

            localVideo.srcObject = localStream;
        } catch (err) {
            console.warn("Haikuweza kupata kamili permission ya Audio/Video:", err);
            // Fallback: tengeneza empty stream ikiwa permissions zimekataliwa mapema
            localStream = new MediaStream();
        }
    }

    // 2. CONNECT WEBSOCKET SIGNALING
    function connectSocket() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        socket = new WebSocket(`${protocol}//${window.location.host}`);

        socket.onopen = () => {
            statusText.textContent = "Online";
            statusDot.classList.add("online");
            
            socket.send(JSON.stringify({
                type: "join",
                room: room,
                userId: userId,
                userName: userName
            }));
        };

        socket.onmessage = async (event) => {
            const message = JSON.parse(event.data);

            if (message.type === "joined") {
                // Tengeneza connections na washiriki waliopo kabla yako
                message.users.forEach(u => {
                    createPeerConnection(u.id, u.name, true);
                });
            }

            if (message.type === "user-joined") {
                // Mshiriki mpya ameingia; subiri aweke tayari connection
                createPeerConnection(message.userId, message.userName, false);
            }

            if (message.type === "signal") {
                await handleSignal(message.sender, message.data);
            }

            if (message.type === "user-left") {
                removeParticipantTile(message.userId);
            }

            if (message.type === "raise-hand") {
                toggleHandUI(message.senderId, message.raised);
            }

            if (message.type === "chat") {
                appendChatMessage(message.senderName, message.text);
            }
        };

        socket.onclose = () => {
            statusText.textContent = "Disconnected";
            statusDot.classList.remove("online");
        };
    }

    // 3. WEBRTC PEER CONNECTION CREATION
    function createPeerConnection(targetId, targetName, isInitiator) {
        if (peerConnections.has(targetId)) return peerConnections.get(targetId);

        const pc = new RTCPeerConnection(rtcConfig);
        peerConnections.set(targetId, pc);

        // Ongeza local tracks zote zilizopo
        if (localStream) {
            localStream.getTracks().forEach(track => {
                pc.addTrack(track, localStream);
            });
        }

        // Handle Inbound Remote Stream
        pc.ontrack = (event) => {
            let tile = document.getElementById(`tile_${targetId}`);
            if (!tile) {
                tile = createParticipantTile(targetId, targetName);
            }
            const remoteVideo = tile.querySelector("video");
            const avatar = tile.querySelector(".avatar-placeholder");

            if (event.streams && event.streams[0]) {
                remoteVideo.srcObject = event.streams[0];
            }

            // Mfumo wa kufuatilia ikiwa video track ipo enabled kwa mshiriki huyo
            const videoTrack = event.streams[0].getVideoTracks()[0];
            if (videoTrack) {
                videoTrack.onunmute = () => { avatar.style.display = "none"; };
                videoTrack.onmute = () => { avatar.style.display = "flex"; };
            }
        };

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                sendSignal(targetId, { type: "candidate", candidate: event.candidate });
            }
        };

        if (isInitiator) {
            pc.onnegotiationneeded = async () => {
                try {
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    sendSignal(targetId, { type: "offer", sdp: pc.localDescription });
                } catch (e) {
                    console.error("Negotiation Offer Error:", e);
                }
            };
        }

        return pc;
    }

    async function handleSignal(senderId, data) {
        let pc = peerConnections.get(senderId);
        if (!pc) {
            pc = createPeerConnection(senderId, "Participant", false);
        }

        if (data.type === "offer") {
            await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            sendSignal(senderId, { type: "answer", sdp: pc.localDescription });
        } else if (data.type === "answer") {
            await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
        } else if (data.type === "candidate") {
            await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
    }

    function sendSignal(targetId, data) {
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({
                type: "signal",
                target: targetId,
                data: data
            }));
        }
    }

    // 4. UI DOM CREATION FOR PARTICIPANTS
    function createParticipantTile(id, name) {
        const tile = document.createElement("div");
        tile.id = `tile_${id}`;
        tile.className = "video-card";

        tile.innerHTML = `
            <div class="avatar-placeholder">
                <i class="fa-solid fa-user-large"></i>
                <span>${name}</span>
            </div>
            <video autoplay playsinline></video>
            <div class="participant-label">
                <i class="fa-solid fa-user"></i>
                <span>${name}</span>
            </div>
            <div id="hand_${id}" class="hand-badge">
                <i class="fa-solid fa-hand"></i>
            </div>
        `;

        videoGrid.appendChild(tile);
        return tile;
    }

    function removeParticipantTile(id) {
        if (peerConnections.has(id)) {
            peerConnections.get(id).close();
            peerConnections.delete(id);
        }
        const tile = document.getElementById(`tile_${id}`);
        if (tile) tile.remove();
    }

    // 5. MEDIA TOGGLES & CONTROLS
    cameraBtn.onclick = () => {
        if (!localStream) return;
        const videoTrack = localStream.getVideoTracks()[0];
        if (videoTrack) {
            isCameraOn = !isCameraOn;
            videoTrack.enabled = isCameraOn;
            
            cameraBtn.classList.toggle("off", !isCameraOn);
            cameraBtn.classList.toggle("active", isCameraOn);
            cameraBtn.innerHTML = isCameraOn 
                ? '<i class="fa-solid fa-video"></i>' 
                : '<i class="fa-solid fa-video-slash"></i>';

            localAvatar.style.display = isCameraOn ? "none" : "flex";
        }
    };

    micBtn.onclick = () => {
        if (!localStream) return;
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
            isMicOn = !isMicOn;
            audioTrack.enabled = isMicOn;

            micBtn.classList.toggle("off", !isMicOn);
            micBtn.classList.toggle("active", isMicOn);
            micBtn.innerHTML = isMicOn 
                ? '<i class="fa-solid fa-microphone"></i>' 
                : '<i class="fa-solid fa-microphone-slash"></i>';
        }
    };

    handBtn.onclick = () => {
        isHandRaised = !isHandRaised;
        handBtn.classList.toggle("active", isHandRaised);
        localHand.style.display = isHandRaised ? "block" : "none";

        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({
                type: "raise-hand",
                raised: isHandRaised
            }));
        }
    };

    function toggleHandUI(senderId, raised) {
        if (senderId === userId) return;
        const handBadge = document.getElementById(`hand_${senderId}`);
        if (handBadge) {
            handBadge.style.display = raised ? "block" : "none";
        }
    }

    // CHAT SYSTEM
    chatBtn.onclick = () => chatSidebar.classList.toggle("open");
    closeChatBtn.onclick = () => chatSidebar.classList.remove("open");

    sendMsgBtn.onclick = sendChat;
    msgInput.onkeypress = (e) => { if (e.key === "Enter") sendChat(); };

    function sendChat() {
        const text = msgInput.value.trim();
        if (!text) return;

        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({
                type: "chat",
                text: text
            }));
        }
        msgInput.value = "";
    }

    function appendChatMessage(sender, text) {
        const msgDiv = document.createElement("div");
        msgDiv.className = "msg-box";
        msgDiv.innerHTML = `
            <div class="msg-sender">${sender}</div>
            <div>${text}</div>
        `;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    endBtn.onclick = () => {
        if (localStream) {
            localStream.getTracks().forEach(t => t.stop());
        }
        if (socket) socket.close();
        window.location.reload();
    };

    // INITIALIZATION
    joinBtn.onclick = async () => {
        const nameVal = usernameInput.value.trim();
        if (nameVal) userName = nameVal;
        
        localNameLabel.textContent = `${userName} (Wewe)`;
        joinModal.style.display = "none";

        await initMedia();
        connectSocket();
    };
</script>
</body>
</html>
