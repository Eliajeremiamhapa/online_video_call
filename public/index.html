<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Classroom - WebRTC</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #111827; color: white; font-family: Arial, sans-serif; }
        .header { height: 65px; background: #1f2937; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; border-bottom: 1px solid #374151; }
        .logo { font-size: 20px; font-weight: bold; }
        .status { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .dot { width: 10px; height: 10px; background: #ef4444; border-radius: 50%; }
        .dot.online { background: #22c55e; }
        .main { min-height: calc(100vh - 65px); padding: 20px; }
        .room-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .room-name { font-size: 18px; font-weight: bold; }
        .room-link { background: #374151; padding: 10px 15px; border-radius: 8px; font-size: 13px; color: #d1d5db; word-break: break-all; }
        .videos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 1200px; margin: auto; }
        .video-container { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; border: 1px solid #374151; }
        video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; transform: scaleX(-1); }
        #remoteVideo { transform: none; }
        .video-label { position: absolute; bottom: 12px; left: 12px; background: rgba(0,0,0,0.65); padding: 7px 12px; border-radius: 6px; font-size: 13px; z-index: 2; }
        .waiting { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 16px; background: #111827; z-index: 1; }
        .controls { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); background: #1f2937; padding: 12px; border-radius: 50px; display: flex; gap: 10px; border: 1px solid #374151; box-shadow: 0 10px 30px rgba(0,0,0,0.4); z-index: 10; }
        button { border: none; border-radius: 50%; width: 52px; height: 52px; font-size: 20px; cursor: pointer; background: #374151; color: white; transition: 0.2s; }
        button:hover { background: #4b5563; }
        button.active { background: #2563eb; }
        button.danger { background: #dc2626; }
        .start-button { position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%); padding: 13px 25px; border-radius: 30px; background: #2563eb; color: white; font-size: 15px; font-weight: bold; border: none; cursor: pointer; z-index: 10; }
        .start-button:hover { background: #1d4ed8; }
        @media (max-width: 700px) { .videos { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">🎓 Live Classroom</div>
        <div class="status">
            <span id="statusDot" class="dot"></span>
            <span id="statusText">Connecting...</span>
        </div>
    </header>

    <main class="main">
        <div class="room-bar">
            <div class="room-name">Room: <span id="roomName">...</span></div>
            <div class="room-link">Share link: <span id="shareLink"></span></div>
        </div>

        <div class="videos">
            <div class="video-container">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="video-label">👤 You</div>
            </div>
            <div class="video-container">
                <video id="remoteVideo" autoplay playsinline></video>
                <div id="waiting" class="waiting">Waiting for participant...</div>
                <div class="video-label">👤 Participant</div>
            </div>
        </div>
    </main>

    <button id="startButton" class="start-button">🎥 Join & Start Camera</button>

    <div class="controls">
        <button id="micButton" title="Microphone">🎤</button>
        <button id="cameraButton" title="Camera">📹</button>
        <button id="endButton" class="danger" title="End Call">📞</button>
    </div>

<script>
    const localVideo = document.getElementById("localVideo");
    const remoteVideo = document.getElementById("remoteVideo");
    const startButton = document.getElementById("startButton");
    const micButton = document.getElementById("micButton");
    const cameraButton = document.getElementById("cameraButton");
    const endButton = document.getElementById("endButton");
    const statusText = document.getElementById("statusText");
    const statusDot = document.getElementById("statusDot");
    const roomName = document.getElementById("roomName");
    const shareLink = document.getElementById("shareLink");
    const waiting = document.getElementById("waiting");

    const params = new URLSearchParams(window.location.search);
    let room = params.get("room") || "class1";

    if (!params.get("room")) {
        window.history.replaceState({}, "", window.location.pathname + "?room=" + room);
    }

    roomName.textContent = room;
    shareLink.textContent = window.location.origin + window.location.pathname + "?room=" + room;

    let socket = null;
    let localStream = null;
    let peerConnection = null;
    let pendingCandidates = [];

    const rtcConfig = {
        iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" }
        ]
    };

    function connectSocket() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        socket = new WebSocket(protocol + "//" + window.location.host);

        socket.onopen = () => {
            statusText.textContent = "Connected";
            statusDot.classList.add("online");
            socket.send(JSON.stringify({ type: "join", room: room }));
        };

        socket.onmessage = async (event) => {
            const message = JSON.parse(event.data);

            if (message.type === "user-joined") {
                waiting.textContent = "Connecting to peer...";
                if (localStream) {
                    await createOffer();
                }
            }

            if (message.type === "signal") {
                await handleSignal(message.data);
            }

            if (message.type === "user-left") {
                remoteVideo.srcObject = null;
                waiting.style.display = "flex";
                waiting.textContent = "Participant left the call.";
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
            }

            if (message.type === "room-full") {
                alert("Room is full (Max 2 users).");
            }
        };

        socket.onclose = () => {
            statusText.textContent = "Disconnected";
            statusDot.classList.remove("online");
        };
    }

    function sendSignal(data) {
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: "signal", data: data }));
        }
    }

    function createPeerConnection() {
        if (peerConnection) return peerConnection;

        peerConnection = new RTCPeerConnection(rtcConfig);

        if (localStream) {
            localStream.getTracks().forEach((track) => {
                peerConnection.addTrack(track, localStream);
            });
        }

        peerConnection.ontrack = (event) => {
            if (event.streams && event.streams[0]) {
                remoteVideo.srcObject = event.streams[0];
                waiting.style.display = "none";
            }
        };

        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                sendSignal({ type: "candidate", candidate: event.candidate });
            }
        };

        return peerConnection;
    }

    async function startCamera() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localVideo.srcObject = localStream;
            startButton.style.display = "none";

            micButton.classList.add("active");
            cameraButton.classList.add("active");

            createPeerConnection();
            connectSocket();
        } catch (error) {
            alert("Ruhusu Camera na Microphone kwenye browser kisha ujaribu tena.");
        }
    }

    async function createOffer() {
        try {
            const pc = createPeerConnection();
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            sendSignal({ type: "offer", sdp: pc.localDescription });
        } catch (error) {
            console.error("Offer Error:", error);
        }
    }

    async function handleSignal(data) {
        try {
            const pc = createPeerConnection();

            if (data.type === "offer") {
                await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                
                for (const candidate of pendingCandidates) {
                    await pc.addIceCandidate(candidate);
                }
                pendingCandidates = [];

                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                sendSignal({ type: "answer", sdp: pc.localDescription });
            }

            if (data.type === "answer") {
                await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                for (const candidate of pendingCandidates) {
                    await pc.addIceCandidate(candidate);
                }
                pendingCandidates = [];
            }

            if (data.type === "candidate") {
                const candidate = new RTCIceCandidate(data.candidate);
                if (pc.remoteDescription && pc.remoteDescription.type) {
                    await pc.addIceCandidate(candidate);
                } else {
                    pendingCandidates.push(candidate);
                }
            }
        } catch (error) {
            console.error("Signal Handling Error:", error);
        }
    }

    // CONTROLS
    startButton.onclick = startCamera;

    micButton.onclick = () => {
        if (!localStream) return;
        const track = localStream.getAudioTracks()[0];
        if (track) {
            track.enabled = !track.enabled;
            micButton.textContent = track.enabled ? "🎤" : "🔇";
            micButton.classList.toggle("active", track.enabled);
        }
    };

    cameraButton.onclick = () => {
        if (!localStream) return;
        const track = localStream.getVideoTracks()[0];
        if (track) {
            track.enabled = !track.enabled;
            cameraButton.textContent = track.enabled ? "📹" : "📷";
            cameraButton.classList.toggle("active", track.enabled);
        }
    };

    endButton.onclick = () => {
        if (localStream) {
            localStream.getTracks().forEach((track) => track.stop());
        }
        if (peerConnection) {
            peerConnection.close();
        }
        if (socket) {
            socket.close();
        }
        window.location.reload();
    };
</script>
</body>
</html>
