<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>SPEAK OUT WITH RAS SIMBA | Live Multi-Party Classroom</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: manipulation;
        }
        .header {
            height: 50px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid #334155;
            z-index: 20;
            flex-shrink: 0;
        }
        .logo {
            font-size: 14px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo i {
            font-size: 18px;
        }
        .logo-title {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }
        .logo-title .main-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #38bdf8;
        }
        .logo-title .sub-title {
            font-size: 9px;
            font-weight: 500;
            color: #94a3b8;
            font-style: italic;
        }
        .room-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #94a3b8;
        }
        .room-info b {
            color: #e2e8f0;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #1e293b;
            padding: 3px 8px;
            border-radius: 20px;
            border: 1px solid #334155;
            font-size: 10px;
        }
        .dot {
            width: 7px;
            height: 7px;
            background: #ef4444;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .dot.online {
            background: #22c55e;
            box-shadow: 0 0 6px #22c55e88;
        }
        .container {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }
        
        /* ===== VIDEO GRID - IMPROVED RESPONSIVE FLOW ===== */
        .video-grid {
            flex: 1;
            padding: 10px;
            padding-bottom: 90px; /* Space for bottom controls */
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            grid-auto-rows: max-content;
            align-content: start;
            justify-content: center;
            overflow-y: auto;
            background: #0f172a;
            transition: all 0.3s ease;
        }
        .video-grid.zoomed {
            grid-template-columns: 1fr;
            grid-auto-rows: 1fr;
            padding: 4px;
            padding-bottom: 90px;
            gap: 4px;
        }
        .video-grid.zoomed .video-card {
            aspect-ratio: auto;
            min-height: 75vh;
        }
        .video-grid.zoomed .video-card:not(.active-zoom) {
            display: none;
        }
        .video-card {
            position: relative;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            aspect-ratio: 16/9;
            width: 100%;
            min-height: 160px;
            cursor: pointer;
            transition: border-color 0.3s, transform 0.2s;
        }
        .video-card:hover {
            border-color: #38bdf8;
        }
        .video-card.active-zoom {
            border-color: #f59e0b;
            border-width: 3px;
        }
        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #0f172a;
            display: block;
        }
        .video-card.local video {
            transform: scaleX(-1);
        }
        .avatar-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            color: #94a3b8;
            z-index: 1;
            gap: 4px;
            font-size: 12px;
            text-align: center;
            padding: 8px;
        }
        .avatar-placeholder i {
            font-size: 36px;
            opacity: 0.7;
        }
        .participant-label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(6px);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 500;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 75%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .participant-label i {
            font-size: 10px;
        }
        .hand-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #f59e0b;
            color: #fff;
            padding: 5px;
            border-radius: 50%;
            z-index: 3;
            animation: bounce 0.9s infinite alternate;
            font-size: 12px;
            width: 28px;
            height: 28px;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(245, 158, 11, 0.4);
        }
        .hand-badge.show {
            display: flex;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-4px); }
        }

        /* ===== CHAT SIDEBAR - FIXED INPUT VISIBILITY ===== */
        .chat-sidebar {
            width: 100%;
            max-width: 340px;
            height: 100%;
            background: #1e293b;
            border-left: 1px solid #334155;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 50; /* Higher z-index to stay above controls */
            transform: translateX(100%);
            box-shadow: -8px 0 30px rgba(0, 0, 0, 0.5);
        }
        .chat-sidebar.open {
            transform: translateX(0);
            position: relative;
        }
        .chat-header {
            padding: 12px 14px;
            border-bottom: 1px solid #334155;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            flex-shrink: 0;
        }
        .chat-header span {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-header i.fa-xmark {
            font-size: 18px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .chat-header i.fa-xmark:hover {
            background: #334155;
        }

        /* Chat messages - Scrollable middle flex element */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0f172a;
        }
        .msg-box {
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            border: 1px solid #2d3a4f;
            max-width: 92%;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
        }
        .msg-box.self {
            align-self: flex-end;
            background: #0284c7;
            border-color: #0284c7;
        }
        .msg-box.self .msg-sender {
            color: #b8dfff;
        }
        .msg-sender {
            font-weight: 600;
            font-size: 10px;
            color: #38bdf8;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .msg-sender i {
            font-size: 9px;
        }
        .msg-time {
            font-size: 8px;
            color: #94a3b8;
            margin-top: 2px;
            text-align: right;
            opacity: 0.7;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Chat input - Always pinned at bottom */
        .chat-input-area {
            padding: 12px;
            border-top: 1px solid #334155;
            display: flex;
            gap: 8px;
            background: #1e293b;
            flex-shrink: 0;
            z-index: 55;
            position: sticky;
            bottom: 0;
        }
        .chat-input-area input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            padding: 10px 14px;
            border-radius: 30px;
            outline: none;
            font-size: 13px;
            transition: border 0.2s;
            min-height: 42px;
        }
        .chat-input-area input:focus {
            border-color: #0284c7;
        }
        .chat-input-area button {
            background: #0284c7;
            border: none;
            color: #fff;
            padding: 0 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            min-height: 42px;
        }
        .chat-input-area button:hover {
            background: #0369a1;
        }

        /* ===== CONTROLS BAR - LARGER BUTTONS ===== */
        .controls-wrapper {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: auto;
            max-width: 95%;
        }
        .controls-bar {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(16px);
            padding: 10px 16px;
            border-radius: 50px;
            display: flex;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            flex-wrap: nowrap;
            justify-content: center;
            transition: all 0.3s ease;
            width: auto;
        }
        .controls-bar.compact {
            padding: 6px 12px;
            gap: 6px;
        }
        .controls-bar.compact .btn-ctrl {
            width: 40px;
            height: 40px;
            font-size: 14px;
        }
        .btn-ctrl {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: #334155;
            color: #f8fafc;
            font-size: 19px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            touch-action: manipulation;
            flex-shrink: 0;
            position: relative;
        }
        .btn-ctrl:active {
            transform: scale(0.92);
        }
        .btn-ctrl:hover {
            background: #475569;
        }
        .btn-ctrl.off {
            background: #ef4444;
            color: white;
        }
        .btn-ctrl.active {
            background: #0284c7;
            color: white;
        }
        .btn-ctrl.danger {
            background: #dc2626;
            color: white;
        }
        .btn-ctrl.danger:hover {
            background: #b91c1c;
        }

        /* Toggle button */
        .toggle-controls-btn {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
            touch-action: manipulation;
        }
        .toggle-controls-btn:hover {
            background: rgba(30, 41, 59, 1);
            color: #fff;
        }
        .toggle-controls-btn i {
            margin-right: 4px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
        }
        .modal-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 24px 20px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
        }
        .modal-card h2 {
            margin-bottom: 2px;
            color: #38bdf8;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .modal-card .caption-tag {
            font-size: 12px;
            color: #f59e0b;
            font-weight: 600;
            margin-bottom: 12px;
            font-style: italic;
        }
        .modal-card p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 16px;
        }
        .modal-card input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 40px;
            color: #fff;
            margin-bottom: 14px;
            outline: none;
            text-align: center;
            font-size: 14px;
            transition: border 0.2s;
        }
        .modal-card input:focus {
            border-color: #38bdf8;
        }
        .btn-join {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-join:hover {
            background: #0369a1;
        }
        .zoom-hint {
            position: fixed;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            color: #94a3b8;
            z-index: 26;
            display: none;
            pointer-events: none;
            border: 1px solid #334155;
            white-space: nowrap;
        }
        .zoom-hint.show {
            display: block;
        }

        /* ===== RESPONSIVE MOBILE STYLES ===== */
        @media (max-width: 640px) {
            .header {
                height: 48px;
                padding: 0 10px;
            }
            .logo {
                font-size: 12px;
            }
            .logo i {
                font-size: 15px;
            }
            .logo-title .main-title {
                font-size: 11px;
            }
            .logo-title .sub-title {
                font-size: 8px;
            }
            .room-info {
                font-size: 10px;
                gap: 4px;
            }
            .status-badge {
                padding: 2px 6px;
                font-size: 9px;
            }
            
            /* Responsive Grid Vertical Flow */
            .video-grid {
                padding: 8px;
                padding-bottom: 90px;
                gap: 8px;
                grid-template-columns: 1fr;
                grid-auto-rows: max-content;
            }
            .video-card {
                border-radius: 10px;
                min-height: 180px;
                aspect-ratio: 16/9;
            }
            .participant-label {
                font-size: 10px;
                padding: 3px 8px;
                bottom: 6px;
                left: 6px;
            }
            
            /* Controls adjustment for smaller screens */
            .controls-wrapper {
                bottom: 12px;
                gap: 6px;
            }
            .controls-bar {
                padding: 8px 12px;
                gap: 8px;
                border-radius: 40px;
            }
            .btn-ctrl {
                width: 48px;
                height: 48px;
                font-size: 17px;
            }
            .controls-bar.compact .btn-ctrl {
                width: 36px;
                height: 36px;
                font-size: 13px;
            }
            
            /* Toggle button */
            .toggle-controls-btn {
                display: flex;
                align-items: center;
                gap: 4px;
                font-size: 10px;
                padding: 3px 10px;
            }
            
            /* Chat sidebar on mobile - Fix input visibility */
            .chat-sidebar {
                position: fixed;
                inset: 0;
                top: 44px;
                max-width: 100%;
                width: 100%;
                height: calc(100vh - 44px);
                z-index: 50;
            }
            .chat-sidebar.open {
                position: fixed;
            }
            .chat-messages {
                padding: 10px;
                padding-bottom: 16px;
            }
            .chat-input-area {
                padding: 10px 12px;
                background: #1e293b;
                border-top: 1px solid #334155;
            }
            .chat-input-area input {
                font-size: 14px;
                padding: 10px 14px;
                min-height: 44px;
            }
            .chat-input-area button {
                min-height: 44px;
                min-width: 48px;
                font-size: 16px;
            }
            .modal-card {
                padding: 20px 16px;
            }
            .avatar-placeholder i {
                font-size: 32px;
            }
            .avatar-placeholder {
                font-size: 11px;
            }
            .zoom-hint {
                bottom: 78px;
                font-size: 10px;
                padding: 4px 12px;
            }
        }

        @media (max-width: 400px) {
            .video-grid {
                padding: 6px;
                padding-bottom: 85px;
                gap: 6px;
            }
            .video-card {
                min-height: 150px;
            }
            .controls-bar {
                padding: 6px 10px;
                gap: 6px;
            }
            .btn-ctrl {
                width: 44px;
                height: 44px;
                font-size: 15px;
            }
            .controls-bar.compact .btn-ctrl {
                width: 32px;
                height: 32px;
                font-size: 11px;
            }
            .toggle-controls-btn {
                font-size: 9px;
                padding: 2px 8px;
            }
            .zoom-hint {
                bottom: 70px;
                font-size: 9px;
                padding: 3px 10px;
            }
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar,
        .video-grid::-webkit-scrollbar {
            width: 4px;
        }
        .chat-messages::-webkit-scrollbar-track,
        .video-grid::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb,
        .video-grid::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- JOIN MODAL -->
    <div id="joinModal" class="modal-overlay">
        <div class="modal-card">
            <h2><i class="fa-solid fa-graduation-cap" style="color:#38bdf8;"></i> SPEAK OUT WITH RAS SIMBA</h2>
            <div class="caption-tag">"Build your confidence, get the vibe!"</div>
            <p>Enter your name to join the Live class</p>
            <input type="text" id="usernameInput" placeholder="Your name, e.g. Elia Mhapa" autofocus />
            <button id="joinBtn" class="btn-join"><i class="fa-solid fa-right-to-bracket"></i> Join Now</button>
        </div>
    </div>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-chalkboard-user"></i>
            <div class="logo-title">
                <span class="main-title">SPEAK OUT WITH RAS SIMBA</span>
                <span class="sub-title">"Build your confidence, get the vibe!"</span>
            </div>
        </div>
        <div class="room-info">
            <span>Room: <b id="roomLabel">...</b></span>
            <div class="status-badge">
                <span id="statusDot" class="dot"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </div>
    </header>

    <!-- VIDEO GRID + CHAT -->
    <div class="container">
        <div id="videoGrid" class="video-grid">
            <!-- Local tile -->
        </div>
        <div id="chatSidebar" class="chat-sidebar">
            <div class="chat-header">
                <span><i class="fa-solid fa-comments"></i> Chat</span>
                <i id="closeChatBtn" class="fa-solid fa-xmark"></i>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="msgInput" placeholder="Type a message..." />
                <button id="sendMsgBtn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- ZOOM HINT -->
    <div id="zoomHint" class="zoom-hint">Click tile to zoom • Click again to return</div>

    <!-- CONTROLS WRAPPER -->
    <div class="controls-wrapper">
        <button id="toggleControlsBtn" class="toggle-controls-btn">
            <i class="fa-solid fa-chevron-left"></i> Compact
        </button>
        <div id="controlsBar" class="controls-bar">
            <button id="micBtn" class="btn-ctrl off" title="Mic">
                <i class="fa-solid fa-microphone-slash"></i>
            </button>
            <button id="cameraBtn" class="btn-ctrl off" title="Camera">
                <i class="fa-solid fa-video-slash"></i>
            </button>
            <button id="handBtn" class="btn-ctrl" title="Hand">
                <i class="fa-solid fa-hand"></i>
            </button>
            <button id="chatBtn" class="btn-ctrl" title="Chat">
                <i class="fa-solid fa-message"></i>
            </button>
            <button id="endBtn" class="btn-ctrl danger" title="Leave">
                <i class="fa-solid fa-phone-slash"></i>
            </button>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            const videoGrid = document.getElementById("videoGrid");
            const joinModal = document.getElementById("joinModal");
            const joinBtn = document.getElementById("joinBtn");
            const usernameInput = document.getElementById("usernameInput");
            const roomLabel = document.getElementById("roomLabel");
            const statusDot = document.getElementById("statusDot");
            const statusText = document.getElementById("statusText");
            const micBtn = document.getElementById("micBtn");
            const cameraBtn = document.getElementById("cameraBtn");
            const handBtn = document.getElementById("handBtn");
            const chatBtn = document.getElementById("chatBtn");
            const endBtn = document.getElementById("endBtn");
            const chatSidebar = document.getElementById("chatSidebar");
            const closeChatBtn = document.getElementById("closeChatBtn");
            const chatMessages = document.getElementById("chatMessages");
            const msgInput = document.getElementById("msgInput");
            const sendMsgBtn = document.getElementById("sendMsgBtn");
            const zoomHint = document.getElementById("zoomHint");
            const controlsBar = document.getElementById("controlsBar");
            const toggleBtn = document.getElementById("toggleControlsBtn");

            // Create local tile
            const localTile = document.createElement("div");
            localTile.id = "localTile";
            localTile.className = "video-card local";
            localTile.dataset.userId = "local";
            localTile.dataset.userName = "You";
            localTile.innerHTML = `
                <div id="localAvatar" class="avatar-placeholder">
                    <i class="fa-solid fa-user-slash"></i>
                    <span>Camera is Off</span>
                </div>
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="participant-label">
                    <i class="fa-solid fa-user"></i>
                    <span id="localNameLabel">You</span>
                </div>
                <div id="localHand" class="hand-badge">
                    <i class="fa-solid fa-hand"></i>
                </div>
            `;
            videoGrid.appendChild(localTile);

            const localVideo = document.getElementById("localVideo");
            const localAvatar = document.getElementById("localAvatar");
            const localNameLabel = document.getElementById("localNameLabel");
            const localHand = document.getElementById("localHand");

            // State
            const params = new URLSearchParams(window.location.search);
            const room = params.get("room") || "class1";
            roomLabel.textContent = room;

            const userId = "user_" + Math.random().toString(36).substr(2, 9);
            let userName = "Participant";
            let socket = null;
            let localStream = null;
            let isCameraOn = false;
            let isMicOn = false;
            let isHandRaised = false;
            let isZoomed = false;
            let zoomedTileId = null;
            let isCompact = false;
            const peerConnections = new Map();

            const rtcConfig = {
                iceServers: [
                    { urls: "stun:stun.l.google.com:19302" },
                    { urls: "stun:stun1.l.google.com:19302" }
                ]
            };

            // ---- TOGGLE CONTROLS ----
            toggleBtn.addEventListener("click", function() {
                isCompact = !isCompact;
                controlsBar.classList.toggle("compact", isCompact);
                if (isCompact) {
                    toggleBtn.innerHTML = '<i class="fa-solid fa-chevron-right"></i> Expand';
                } else {
                    toggleBtn.innerHTML = '<i class="fa-solid fa-chevron-left"></i> Compact';
                }
            });

            // ---- MEDIA WITH CLEAR MIC AUDIO CONSTRAINTS ----
            async function initMedia() {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true
                        },
                        video: true
                    });
                    localStream.getAudioTracks().forEach(t => t.enabled = false);
                    localStream.getVideoTracks().forEach(t => t.enabled = false);
                    localVideo.srcObject = localStream;
                } catch (err) {
                    console.warn("Media permission error:", err);
                    localStream = new MediaStream();
                }
            }

            // ---- SOCKET ----
            function connectSocket() {
                const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
                socket = new WebSocket(`${protocol}//${window.location.host}`);

                socket.onopen = () => {
                    statusText.textContent = "Online";
                    statusDot.classList.add("online");
                    socket.send(JSON.stringify({
                        type: "join",
                        room: room,
                        userId: userId,
                        userName: userName
                    }));
                };

                socket.onmessage = async (event) => {
                    const msg = JSON.parse(event.data);
                    if (msg.type === "joined") {
                        msg.users.forEach(u => createPeerConnection(u.id, u.name, true));
                    }
                    if (msg.type === "user-joined") {
                        createPeerConnection(msg.userId, msg.userName, false);
                    }
                    if (msg.type === "signal") {
                        await handleSignal(msg.sender, msg.data);
                    }
                    if (msg.type === "user-left") {
                        removeParticipantTile(msg.userId);
                    }
                    if (msg.type === "raise-hand") {
                        toggleHandUI(msg.senderId, msg.raised);
                    }
                    if (msg.type === "chat") {
                        appendChatMessage(msg.senderName, msg.text, msg.senderId === userId);
                    }
                };

                socket.onclose = () => {
                    statusText.textContent = "Disconnected";
                    statusDot.classList.remove("online");
                };
            }

            // ---- PEER CONNECTION ----
            function createPeerConnection(targetId, targetName, isInitiator) {
                if (peerConnections.has(targetId)) return peerConnections.get(targetId);
                const pc = new RTCPeerConnection(rtcConfig);
                peerConnections.set(targetId, pc);

                if (localStream) {
                    localStream.getTracks().forEach(track => {
                        pc.addTrack(track, localStream);
                    });
                }

                pc.ontrack = (evt) => {
                    let remoteCard = document.getElementById(`card_${targetId}`);
                    if (!remoteCard) {
                        remoteCard = document.createElement("div");
                        remoteCard.id = `card_${targetId}`;
                        remoteCard.className = "video-card";
                        remoteCard.dataset.userId = targetId;
                        remoteCard.dataset.userName = targetName;
                        remoteCard.innerHTML = `
                            <div id="avatar_${targetId}" class="avatar-placeholder">
                                <i class="fa-solid fa-user"></i>
                                <span>${targetName}</span>
                            </div>
                            <video id="video_${targetId}" autoplay playsinline></video>
                            <div class="participant-label">
                                <i class="fa-solid fa-user"></i>
                                <span>${targetName}</span>
                            </div>
                            <div id="hand_${targetId}" class="hand-badge">
                                <i class="fa-solid fa-hand"></i>
                            </div>
                        `;
                        remoteCard.addEventListener("click", () => handleTileClick(remoteCard.id));
                        videoGrid.appendChild(remoteCard);
                        updateZoomHint();
                    }

                    const remoteVideo = document.getElementById(`video_${targetId}`);
                    const remoteAvatar = document.getElementById(`avatar_${targetId}`);
                    if (remoteVideo) {
                        remoteVideo.srcObject = evt.streams[0];
                        if (evt.track.kind === "video") {
                            evt.track.onmute = () => { if (remoteAvatar) remoteAvatar.style.display = "flex"; };
                            evt.track.onunmute = () => { if (remoteAvatar) remoteAvatar.style.display = "none"; };
                        }
                    }
                };

                pc.onicecandidate = (evt) => {
                    if (evt.candidate && socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({
                            type: "signal",
                            target: targetId,
                            sender: userId,
                            data: { candidate: evt.candidate }
                        }));
                    }
                };

                if (isInitiator) {
                    pc.onnegotiationneeded = async () => {
                        try {
                            const offer = await pc.createOffer();
                            await pc.setLocalDescription(offer);
                            if (socket && socket.readyState === WebSocket.OPEN) {
                                socket.send(JSON.stringify({
                                    type: "signal",
                                    target: targetId,
                                    sender: userId,
                                    data: { sdp: pc.localDescription }
                                }));
                            }
                        } catch (err) {
                            console.error("Offer creation error:", err);
                        }
                    };
                }

                return pc;
            }

            async function handleSignal(senderId, data) {
                let pc = peerConnections.get(senderId);
                if (!pc) {
                    pc = createPeerConnection(senderId, "Participant", false);
                }
                if (data.sdp) {
                    await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                    if (data.sdp.type === "offer") {
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        if (socket && socket.readyState === WebSocket.OPEN) {
                            socket.send(JSON.stringify({
                                type: "signal",
                                target: senderId,
                                sender: userId,
                                data: { sdp: pc.localDescription }
                            }));
                        }
                    }
                } else if (data.candidate) {
                    try {
                        await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                    } catch (err) {
                        console.error("Candidate add error:", err);
                    }
                }
            }

            function removeParticipantTile(id) {
                const pc = peerConnections.get(id);
                if (pc) {
                    pc.close();
                    peerConnections.delete(id);
                }
                const card = document.getElementById(`card_${id}`);
                if (card) {
                    if (zoomedTileId === card.id) resetZoom();
                    card.remove();
                }
                updateZoomHint();
            }

            // ---- TILE ZOOM HANDLER ----
            function handleTileClick(tileId) {
                if (isZoomed && zoomedTileId === tileId) {
                    resetZoom();
                } else {
                    applyZoom(tileId);
                }
            }

            function applyZoom(tileId) {
                const cards = document.querySelectorAll(".video-card");
                cards.forEach(card => card.classList.remove("active-zoom"));

                const targetTile = document.getElementById(tileId);
                if (targetTile) {
                    targetTile.classList.add("active-zoom");
                    videoGrid.classList.add("zoomed");
                    isZoomed = true;
                    zoomedTileId = tileId;
                }
            }

            function resetZoom() {
                const cards = document.querySelectorAll(".video-card");
                cards.forEach(card => card.classList.remove("active-zoom"));
                videoGrid.classList.remove("zoomed");
                isZoomed = false;
                zoomedTileId = null;
            }

            localTile.addEventListener("click", () => handleTileClick("localTile"));

            function updateZoomHint() {
                const count = document.querySelectorAll(".video-card").length;
                if (count > 1) {
                    zoomHint.classList.add("show");
                } else {
                    zoomHint.classList.remove("show");
                    if (isZoomed) resetZoom();
                }
            }

            // ---- CONTROL BUTTONS ----
            micBtn.addEventListener("click", () => {
                isMicOn = !isMicOn;
                if (localStream && localStream.getAudioTracks().length > 0) {
                    localStream.getAudioTracks()[0].enabled = isMicOn;
                }
                micBtn.classList.toggle("off", !isMicOn);
                micBtn.classList.toggle("active", isMicOn);
                micBtn.innerHTML = isMicOn ? '<i class="fa-solid fa-microphone"></i>' : '<i class="fa-solid fa-microphone-slash"></i>';
            });

            cameraBtn.addEventListener("click", () => {
                isCameraOn = !isCameraOn;
                if (localStream && localStream.getVideoTracks().length > 0) {
                    localStream.getVideoTracks()[0].enabled = isCameraOn;
                }
                localAvatar.style.display = isCameraOn ? "none" : "flex";
                cameraBtn.classList.toggle("off", !isCameraOn);
                cameraBtn.classList.toggle("active", isCameraOn);
                cameraBtn.innerHTML = isCameraOn ? '<i class="fa-solid fa-video"></i>' : '<i class="fa-solid fa-video-slash"></i>';
            });

            handBtn.addEventListener("click", () => {
                isHandRaised = !isHandRaised;
                toggleHandUI("local", isHandRaised);
                handBtn.classList.toggle("active", isHandRaised);
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: "raise-hand",
                        room: room,
                        senderId: userId,
                        raised: isHandRaised
                    }));
                }
            });

            function toggleHandUI(id, raised) {
                const targetHand = id === "local" || id === userId ? localHand : document.getElementById(`hand_${id}`);
                if (targetHand) {
                    if (raised) targetHand.classList.add("show");
                    else targetHand.classList.remove("show");
                }
            }

            chatBtn.addEventListener("click", () => {
                chatSidebar.classList.toggle("open");
                chatBtn.classList.toggle("active", chatSidebar.classList.contains("open"));
            });

            closeChatBtn.addEventListener("click", () => {
                chatSidebar.classList.remove("open");
                chatBtn.classList.remove("active");
            });

            endBtn.addEventListener("click", () => {
                if (confirm("Are you sure you want to leave the class?")) {
                    window.location.reload();
                }
            });

            // ---- CHAT SYSTEM ----
            function sendChatMessage() {
                const text = msgInput.value.trim();
                if (!text) return;
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: "chat",
                        room: room,
                        senderId: userId,
                        senderName: userName,
                        text: text
                    }));
                }
                msgInput.value = "";
            }

            sendMsgBtn.addEventListener("click", sendChatMessage);
            msgInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter") sendChatMessage();
            });

            function appendChatMessage(sender, text, isSelf) {
                const msgBox = document.createElement("div");
                msgBox.className = `msg-box ${isSelf ? "self" : ""}`;
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                msgBox.innerHTML = `
                    <div class="msg-sender"><i class="fa-solid fa-user"></i> ${sender}</div>
                    <div class="msg-text">${escapeHtml(text)}</div>
                    <div class="msg-time">${time}</div>
                `;
                chatMessages.appendChild(msgBox);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function escapeHtml(str) {
                return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
            }

            // ---- JOIN CLASS ----
            joinBtn.addEventListener("click", async () => {
                const nameVal = usernameInput.value.trim();
                if (nameVal) userName = nameVal;
                localNameLabel.textContent = userName + " (You)";

                joinModal.style.display = "none";

                await initMedia();
                connectSocket();
                updateZoomHint();
            });

            usernameInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter") joinBtn.click();
            });

        })();
    </script>
</body>
</html>
