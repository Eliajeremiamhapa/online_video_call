<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Live Multi-Party Classroom</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: manipulation;
        }
        .header {
            height: 50px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid #334155;
            z-index: 20;
            flex-shrink: 0;
        }
        .logo {
            font-size: 14px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo i {
            font-size: 18px;
        }
        .room-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #94a3b8;
        }
        .room-info b {
            color: #e2e8f0;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #1e293b;
            padding: 3px 8px;
            border-radius: 20px;
            border: 1px solid #334155;
            font-size: 10px;
        }
        .dot {
            width: 7px;
            height: 7px;
            background: #ef4444;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .dot.online {
            background: #22c55e;
            box-shadow: 0 0 6px #22c55e88;
        }
        .container {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }
        .video-grid {
            flex: 1;
            padding: 8px;
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            grid-auto-rows: minmax(140px, 1fr);
            align-content: center;
            justify-content: center;
            overflow-y: auto;
            background: #0f172a;
            transition: all 0.3s ease;
        }
        .video-grid.zoomed {
            grid-template-columns: 1fr;
            grid-auto-rows: 1fr;
            padding: 4px;
            gap: 4px;
        }
        .video-grid.zoomed .video-card {
            aspect-ratio: auto;
            min-height: 80vh;
        }
        .video-grid.zoomed .video-card:not(.active-zoom) {
            display: none;
        }
        .video-card {
            position: relative;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            aspect-ratio: 4/3;
            min-height: 120px;
            cursor: pointer;
            transition: border-color 0.3s, transform 0.2s;
        }
        .video-card:hover {
            border-color: #38bdf8;
        }
        .video-card.active-zoom {
            border-color: #f59e0b;
            border-width: 3px;
        }
        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #0f172a;
            display: block;
        }
        .video-card.local video {
            transform: scaleX(-1);
        }
        .avatar-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            color: #94a3b8;
            z-index: 1;
            gap: 4px;
            font-size: 12px;
            text-align: center;
            padding: 8px;
        }
        .avatar-placeholder i {
            font-size: 36px;
            opacity: 0.7;
        }
        .participant-label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(6px);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 10px;
            font-weight: 500;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 75%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .participant-label i {
            font-size: 10px;
        }
        .hand-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #f59e0b;
            color: #fff;
            padding: 5px;
            border-radius: 50%;
            z-index: 3;
            animation: bounce 0.9s infinite alternate;
            font-size: 12px;
            width: 28px;
            height: 28px;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(245, 158, 11, 0.4);
        }
        .hand-badge.show {
            display: flex;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-4px); }
        }

        /* ===== CHAT SIDEBAR - IMPROVED ===== */
        .chat-sidebar {
            width: 100%;
            max-width: 340px;
            background: #1e293b;
            border-left: 1px solid #334155;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 15;
            transform: translateX(100%);
            box-shadow: -8px 0 30px rgba(0, 0, 0, 0.5);
        }
        .chat-sidebar.open {
            transform: translateX(0);
            position: relative;
        }
        .chat-header {
            padding: 12px 14px;
            border-bottom: 1px solid #334155;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            flex-shrink: 0;
        }
        .chat-header span {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-header i.fa-xmark {
            font-size: 18px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .chat-header i.fa-xmark:hover {
            background: #334155;
        }

        /* Chat messages - fixed height with scroll */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #0f172a;
            max-height: calc(100vh - 180px);
            min-height: 200px;
        }
        .msg-box {
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            border: 1px solid #2d3a4f;
            max-width: 92%;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
        }
        .msg-box.self {
            align-self: flex-end;
            background: #0284c7;
            border-color: #0284c7;
        }
        .msg-box.self .msg-sender {
            color: #b8dfff;
        }
        .msg-sender {
            font-weight: 600;
            font-size: 10px;
            color: #38bdf8;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .msg-sender i {
            font-size: 9px;
        }
        .msg-time {
            font-size: 8px;
            color: #94a3b8;
            margin-top: 2px;
            text-align: right;
            opacity: 0.7;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Chat input - fixed at bottom of sidebar */
        .chat-input-area {
            padding: 8px 10px;
            border-top: 1px solid #334155;
            display: flex;
            gap: 6px;
            background: #0f172a;
            flex-shrink: 0;
        }
        .chat-input-area input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            padding: 8px 12px;
            border-radius: 30px;
            outline: none;
            font-size: 12px;
            transition: border 0.2s;
            min-height: 36px;
        }
        .chat-input-area input:focus {
            border-color: #0284c7;
        }
        .chat-input-area button {
            background: #0284c7;
            border: none;
            color: #fff;
            padding: 0 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            min-height: 36px;
        }
        .chat-input-area button:hover {
            background: #0369a1;
        }

        /* ===== CONTROLS BAR ===== */
        .controls-wrapper {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: auto;
            max-width: 95%;
        }
        .controls-bar {
            background: rgba(30, 41, 59, 0.92);
            backdrop-filter: blur(16px);
            padding: 8px 14px;
            border-radius: 50px;
            display: flex;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            flex-wrap: nowrap;
            justify-content: center;
            transition: all 0.3s ease;
            width: auto;
        }
        .controls-bar.compact {
            padding: 6px 10px;
            gap: 4px;
        }
        .controls-bar.compact .btn-ctrl {
            width: 34px;
            height: 34px;
            font-size: 12px;
        }
        .btn-ctrl {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: #334155;
            color: #f8fafc;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            touch-action: manipulation;
            flex-shrink: 0;
            position: relative;
        }
        .btn-ctrl:active {
            transform: scale(0.92);
        }
        .btn-ctrl:hover {
            background: #475569;
        }
        .btn-ctrl.off {
            background: #ef4444;
            color: white;
        }
        .btn-ctrl.active {
            background: #0284c7;
            color: white;
        }
        .btn-ctrl.danger {
            background: #dc2626;
            color: white;
        }
        .btn-ctrl.danger:hover {
            background: #b91c1c;
        }

        /* Toggle button */
        .toggle-controls-btn {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
            touch-action: manipulation;
        }
        .toggle-controls-btn:hover {
            background: rgba(30, 41, 59, 0.9);
            color: #fff;
        }
        .toggle-controls-btn i {
            margin-right: 4px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
        }
        .modal-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 24px 20px;
            border-radius: 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
        }
        .modal-card h2 {
            margin-bottom: 4px;
            color: #38bdf8;
            font-size: 20px;
        }
        .modal-card p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 16px;
        }
        .modal-card input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 40px;
            color: #fff;
            margin-bottom: 14px;
            outline: none;
            text-align: center;
            font-size: 14px;
            transition: border 0.2s;
        }
        .modal-card input:focus {
            border-color: #38bdf8;
        }
        .btn-join {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-join:hover {
            background: #0369a1;
        }
        .zoom-hint {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            color: #94a3b8;
            z-index: 26;
            display: none;
            pointer-events: none;
            border: 1px solid #334155;
            white-space: nowrap;
        }
        .zoom-hint.show {
            display: block;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .header {
                height: 44px;
                padding: 0 10px;
            }
            .logo {
                font-size: 12px;
            }
            .logo i {
                font-size: 15px;
            }
            .room-info {
                font-size: 10px;
                gap: 4px;
            }
            .status-badge {
                padding: 2px 6px;
                font-size: 9px;
            }
            .video-grid {
                padding: 6px;
                gap: 6px;
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                grid-auto-rows: minmax(100px, 1fr);
            }
            .video-grid.zoomed .video-card:not(.active-zoom) {
                display: none;
            }
            .video-grid.zoomed .video-card.active-zoom {
                min-height: 60vh;
            }
            .video-card {
                border-radius: 10px;
                min-height: 90px;
            }
            .participant-label {
                font-size: 9px;
                padding: 2px 8px;
                bottom: 5px;
                left: 5px;
            }
            
            /* Controls */
            .controls-wrapper {
                bottom: 10px;
                gap: 6px;
            }
            .controls-bar {
                padding: 6px 12px;
                gap: 6px;
                border-radius: 40px;
            }
            .controls-bar.compact {
                padding: 4px 8px;
                gap: 3px;
            }
            .controls-bar.compact .btn-ctrl {
                width: 32px;
                height: 32px;
                font-size: 11px;
            }
            .btn-ctrl {
                width: 40px;
                height: 40px;
                font-size: 15px;
            }
            
            /* Toggle button */
            .toggle-controls-btn {
                display: flex;
                align-items: center;
                gap: 4px;
                font-size: 10px;
                padding: 3px 10px;
            }
            
            /* Chat sidebar - full width */
            .chat-sidebar {
                max-width: 100%;
                width: 100%;
            }
            .chat-messages {
                max-height: calc(100vh - 160px);
                min-height: 150px;
                padding: 8px 10px;
            }
            .chat-input-area {
                padding: 6px 10px;
            }
            .chat-input-area input {
                font-size: 14px;
                padding: 10px 14px;
                min-height: 42px;
            }
            .chat-input-area button {
                min-height: 42px;
                min-width: 46px;
                font-size: 16px;
                padding: 0 16px;
            }
            .modal-card {
                padding: 20px 16px;
            }
            .avatar-placeholder i {
                font-size: 28px;
            }
            .avatar-placeholder {
                font-size: 11px;
            }
            .zoom-hint {
                bottom: 72px;
                font-size: 10px;
                padding: 4px 12px;
            }
        }

        @media (max-width: 400px) {
            .video-grid {
                padding: 4px;
                gap: 4px;
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
                grid-auto-rows: minmax(80px, 1fr);
            }
            .controls-bar {
                padding: 4px 8px;
                gap: 4px;
            }
            .controls-bar.compact {
                padding: 3px 6px;
                gap: 2px;
            }
            .controls-bar.compact .btn-ctrl {
                width: 28px;
                height: 28px;
                font-size: 10px;
            }
            .btn-ctrl {
                width: 36px;
                height: 36px;
                font-size: 13px;
            }
            .toggle-controls-btn {
                font-size: 9px;
                padding: 2px 8px;
            }
            .chat-messages {
                max-height: calc(100vh - 150px);
                min-height: 120px;
            }
            .chat-input-area input {
                font-size: 13px;
                padding: 8px 12px;
                min-height: 38px;
            }
            .chat-input-area button {
                min-height: 38px;
                min-width: 40px;
                font-size: 14px;
                padding: 0 12px;
            }
            .zoom-hint {
                bottom: 64px;
                font-size: 9px;
                padding: 3px 10px;
            }
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar,
        .video-grid::-webkit-scrollbar {
            width: 3px;
        }
        .chat-messages::-webkit-scrollbar-track,
        .video-grid::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb,
        .video-grid::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- JOIN MODAL -->
    <div id="joinModal" class="modal-overlay">
        <div class="modal-card">
            <h2><i class="fa-solid fa-graduation-cap" style="color:#38bdf8;"></i> Live Classroom</h2>
            <p>Ingiza jina lako ili kujiunga</p>
            <input type="text" id="usernameInput" placeholder="Jina lako, e.g. Elia Mhapa" autofocus />
            <button id="joinBtn" class="btn-join"><i class="fa-solid fa-right-to-bracket"></i> Jiunge Sasa</button>
        </div>
    </div>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-chalkboard-user"></i>
            <span>Classroom</span>
        </div>
        <div class="room-info">
            <span>Room: <b id="roomLabel">...</b></span>
            <div class="status-badge">
                <span id="statusDot" class="dot"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </div>
    </header>

    <!-- VIDEO GRID + CHAT -->
    <div class="container">
        <div id="videoGrid" class="video-grid">
            <!-- Local tile -->
        </div>
        <div id="chatSidebar" class="chat-sidebar">
            <div class="chat-header">
                <span><i class="fa-solid fa-comments"></i> Chat</span>
                <i id="closeChatBtn" class="fa-solid fa-xmark"></i>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="msgInput" placeholder="Andika ujumbe..." />
                <button id="sendMsgBtn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- ZOOM HINT -->
    <div id="zoomHint" class="zoom-hint">Bonyeza tile kuizoom • Bonyeza tena kurudi</div>

    <!-- CONTROLS WRAPPER -->
    <div class="controls-wrapper">
        <button id="toggleControlsBtn" class="toggle-controls-btn">
            <i class="fa-solid fa-chevron-left"></i> Compact
        </button>
        <div id="controlsBar" class="controls-bar">
            <button id="micBtn" class="btn-ctrl off" title="Mic">
                <i class="fa-solid fa-microphone-slash"></i>
            </button>
            <button id="cameraBtn" class="btn-ctrl off" title="Camera">
                <i class="fa-solid fa-video-slash"></i>
            </button>
            <button id="handBtn" class="btn-ctrl" title="Hand">
                <i class="fa-solid fa-hand"></i>
            </button>
            <button id="chatBtn" class="btn-ctrl" title="Chat">
                <i class="fa-solid fa-message"></i>
            </button>
            <button id="endBtn" class="btn-ctrl danger" title="Leave">
                <i class="fa-solid fa-phone-slash"></i>
            </button>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            const videoGrid = document.getElementById("videoGrid");
            const joinModal = document.getElementById("joinModal");
            const joinBtn = document.getElementById("joinBtn");
            const usernameInput = document.getElementById("usernameInput");
            const roomLabel = document.getElementById("roomLabel");
            const statusDot = document.getElementById("statusDot");
            const statusText = document.getElementById("statusText");
            const micBtn = document.getElementById("micBtn");
            const cameraBtn = document.getElementById("cameraBtn");
            const handBtn = document.getElementById("handBtn");
            const chatBtn = document.getElementById("chatBtn");
            const endBtn = document.getElementById("endBtn");
            const chatSidebar = document.getElementById("chatSidebar");
            const closeChatBtn = document.getElementById("closeChatBtn");
            const chatMessages = document.getElementById("chatMessages");
            const msgInput = document.getElementById("msgInput");
            const sendMsgBtn = document.getElementById("sendMsgBtn");
            const zoomHint = document.getElementById("zoomHint");
            const controlsBar = document.getElementById("controlsBar");
            const toggleBtn = document.getElementById("toggleControlsBtn");

            // Create local tile
            const localTile = document.createElement("div");
            localTile.id = "localTile";
            localTile.className = "video-card local";
            localTile.dataset.userId = "local";
            localTile.dataset.userName = "Wewe";
            localTile.innerHTML = `
                <div id="localAvatar" class="avatar-placeholder">
                    <i class="fa-solid fa-user-slash"></i>
                    <span>Kamera Iko Off</span>
                </div>
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="participant-label">
                    <i class="fa-solid fa-user"></i>
                    <span id="localNameLabel">Wewe</span>
                </div>
                <div id="localHand" class="hand-badge">
                    <i class="fa-solid fa-hand"></i>
                </div>
            `;
            videoGrid.appendChild(localTile);

            const localVideo = document.getElementById("localVideo");
            const localAvatar = document.getElementById("localAvatar");
            const localNameLabel = document.getElementById("localNameLabel");
            const localHand = document.getElementById("localHand");

            // State
            const params = new URLSearchParams(window.location.search);
            const room = params.get("room") || "class1";
            roomLabel.textContent = room;

            const userId = "user_" + Math.random().toString(36).substr(2, 9);
            let userName = "Participant";
            let socket = null;
            let localStream = null;
            let isCameraOn = false;
            let isMicOn = false;
            let isHandRaised = false;
            let isZoomed = false;
            let zoomedTileId = null;
            let isCompact = false;
            const peerConnections = new Map();

            const rtcConfig = {
                iceServers: [
                    { urls: "stun:stun.l.google.com:19302" },
                    { urls: "stun:stun1.l.google.com:19302" }
                ]
            };

            // ---- TOGGLE CONTROLS ----
            toggleBtn.addEventListener("click", function() {
                isCompact = !isCompact;
                controlsBar.classList.toggle("compact", isCompact);
                if (isCompact) {
                    toggleBtn.innerHTML = '<i class="fa-solid fa-chevron-right"></i> Expand';
                } else {
                    toggleBtn.innerHTML = '<i class="fa-solid fa-chevron-left"></i> Compact';
                }
            });

            // ---- MEDIA ----
            async function initMedia() {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        audio: true,
                        video: true
                    });
                    localStream.getAudioTracks().forEach(t => t.enabled = false);
                    localStream.getVideoTracks().forEach(t => t.enabled = false);
                    localVideo.srcObject = localStream;
                } catch (err) {
                    console.warn("Media permission error:", err);
                    localStream = new MediaStream();
                }
            }

            // ---- SOCKET ----
            function connectSocket() {
                const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
                socket = new WebSocket(`${protocol}//${window.location.host}`);

                socket.onopen = () => {
                    statusText.textContent = "Online";
                    statusDot.classList.add("online");
                    socket.send(JSON.stringify({
                        type: "join",
                        room: room,
                        userId: userId,
                        userName: userName
                    }));
                };

                socket.onmessage = async (event) => {
                    const msg = JSON.parse(event.data);
                    if (msg.type === "joined") {
                        msg.users.forEach(u => createPeerConnection(u.id, u.name, true));
                    }
                    if (msg.type === "user-joined") {
                        createPeerConnection(msg.userId, msg.userName, false);
                    }
                    if (msg.type === "signal") {
                        await handleSignal(msg.sender, msg.data);
                    }
                    if (msg.type === "user-left") {
                        removeParticipantTile(msg.userId);
                    }
                    if (msg.type === "raise-hand") {
                        toggleHandUI(msg.senderId, msg.raised);
                    }
                    if (msg.type === "chat") {
                        appendChatMessage(msg.senderName, msg.text, msg.senderId === userId);
                    }
                };

                socket.onclose = () => {
                    statusText.textContent = "Disconnected";
                    statusDot.classList.remove("online");
                };
            }

            // ---- PEER ----
            function createPeerConnection(targetId, targetName, isInitiator) {
                if (peerConnections.has(targetId)) return peerConnections.get(targetId);
                const pc = new RTCPeerConnection(rtcConfig);
                peerConnections.set(targetId, pc);

                if (localStream) {
                    localStream.getTracks().forEach(track => {
                        pc.addTrack(track, localStream);
                    });
                }

                pc.ontrack = (event) => {
                    let tile = document.getElementById(`tile_${targetId}`);
                    if (!tile) {
                        tile = createParticipantTile(targetId, targetName);
                    }
                    const remoteVideo = tile.querySelector("video");
                    const avatar = tile.querySelector(".avatar-placeholder");
                    if (event.streams && event.streams[0]) {
                        remoteVideo.srcObject = event.streams[0];
                        const vt = event.streams[0].getVideoTracks()[0];
                        if (vt) {
                            vt.onunmute = () => { if (avatar) avatar.style.display = "none"; };
                            vt.onmute = () => { if (avatar) avatar.style.display = "flex"; };
                            if (vt.enabled) avatar.style.display = "none";
                        }
                    }
                };

                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        sendSignal(targetId, { type: "candidate", candidate: event.candidate });
                    }
                };

                if (isInitiator) {
                    pc.onnegotiationneeded = async () => {
                        try {
                            const offer = await pc.createOffer();
                            await pc.setLocalDescription(offer);
                            sendSignal(targetId, { type: "offer", sdp: pc.localDescription });
                        } catch (e) { console.error("Offer error:", e); }
                    };
                }
                return pc;
            }

            async function handleSignal(senderId, data) {
                let pc = peerConnections.get(senderId);
                if (!pc) {
                    pc = createPeerConnection(senderId, "Participant", false);
                }
                try {
                    if (data.type === "offer") {
                        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        sendSignal(senderId, { type: "answer", sdp: pc.localDescription });
                    } else if (data.type === "answer") {
                        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                    } else if (data.type === "candidate") {
                        await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                    }
                } catch (e) { console.warn("Signal error:", e); }
            }

            function sendSignal(targetId, data) {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: "signal",
                        target: targetId,
                        data: data
                    }));
                }
            }

            // ---- DOM ----
            function createParticipantTile(id, name) {
                const tile = document.createElement("div");
                tile.id = `tile_${id}`;
                tile.className = "video-card";
                tile.dataset.userId = id;
                tile.dataset.userName = name;
                tile.innerHTML = `
                    <div class="avatar-placeholder">
                        <i class="fa-solid fa-user-large"></i>
                        <span>${name}</span>
                    </div>
                    <video autoplay playsinline></video>
                    <div class="participant-label">
                        <i class="fa-solid fa-user"></i>
                        <span>${name}</span>
                    </div>
                    <div id="hand_${id}" class="hand-badge">
                        <i class="fa-solid fa-hand"></i>
                    </div>
                `;
                tile.addEventListener("click", function(e) {
                    e.stopPropagation();
                    toggleZoom(this.id);
                });
                videoGrid.appendChild(tile);
                return tile;
            }

            function removeParticipantTile(id) {
                if (peerConnections.has(id)) {
                    peerConnections.get(id).close();
                    peerConnections.delete(id);
                }
                const tile = document.getElementById(`tile_${id}`);
                if (tile) {
                    if (isZoomed && zoomedTileId === id) {
                        exitZoom();
                    }
                    tile.remove();
                }
            }

            function toggleHandUI(senderId, raised) {
                if (senderId === userId) return;
                const badge = document.getElementById(`hand_${senderId}`);
                if (badge) {
                    badge.classList.toggle("show", raised);
                }
            }

            // ---- ZOOM ----
            function toggleZoom(tileId) {
                if (!tileId) return;
                if (isZoomed && zoomedTileId === tileId) {
                    exitZoom();
                    return;
                }
                if (isZoomed) {
                    const currentTile = document.getElementById(zoomedTileId);
                    if (currentTile) currentTile.classList.remove("active-zoom");
                }
                const tile = document.getElementById(tileId);
                if (!tile) return;
                tile.classList.add("active-zoom");
                videoGrid.classList.add("zoomed");
                isZoomed = true;
                zoomedTileId = tileId;
                zoomHint.classList.add("show");
                zoomHint.textContent = "Bonyeza tena kurudi kwenye gridi";
            }

            function exitZoom() {
                const tile = document.getElementById(zoomedTileId);
                if (tile) tile.classList.remove("active-zoom");
                videoGrid.classList.remove("zoomed");
                isZoomed = false;
                zoomedTileId = null;
                zoomHint.classList.remove("show");
            }

            videoGrid.addEventListener("click", function(e) {
                if (e.target === this && isZoomed) {
                    exitZoom();
                }
            });

            // ---- CONTROLS ----
            cameraBtn.onclick = () => {
                if (!localStream) return;
                const track = localStream.getVideoTracks()[0];
                if (track) {
                    isCameraOn = !isCameraOn;
                    track.enabled = isCameraOn;
                    cameraBtn.classList.toggle("off", !isCameraOn);
                    cameraBtn.classList.toggle("active", isCameraOn);
                    cameraBtn.innerHTML = isCameraOn ? '<i class="fa-solid fa-video"></i>' : '<i class="fa-solid fa-video-slash"></i>';
                    localAvatar.style.display = isCameraOn ? "none" : "flex";
                }
            };

            micBtn.onclick = () => {
                if (!localStream) return;
                const track = localStream.getAudioTracks()[0];
                if (track) {
                    isMicOn = !isMicOn;
                    track.enabled = isMicOn;
                    micBtn.classList.toggle("off", !isMicOn);
                    micBtn.classList.toggle("active", isMicOn);
                    micBtn.innerHTML = isMicOn ? '<i class="fa-solid fa-microphone"></i>' : '<i class="fa-solid fa-microphone-slash"></i>';
                }
            };

            handBtn.onclick = () => {
                isHandRaised = !isHandRaised;
                handBtn.classList.toggle("active", isHandRaised);
                localHand.classList.toggle("show", isHandRaised);
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: "raise-hand",
                        raised: isHandRaised
                    }));
                }
            };

            // ---- CHAT ----
            chatBtn.onclick = () => {
                chatSidebar.classList.toggle("open");
                if (window.innerWidth <= 640 && !isCompact) {
                    isCompact = true;
                    controlsBar.classList.add("compact");
                    toggleBtn.innerHTML = '<i class="fa-solid fa-chevron-right"></i> Expand';
                }
            };
            closeChatBtn.onclick = () => {
                chatSidebar.classList.remove("open");
                if (window.innerWidth <= 640 && isCompact) {
                    isCompact = false;
                    controlsBar.classList.remove("compact");
                    toggleBtn.innerHTML = '<i class="fa-solid fa-chevron-left"></i> Compact';
                }
            };

            sendMsgBtn.onclick = sendChat;
            msgInput.onkeypress = (e) => { if (e.key === "Enter") sendChat(); };

            function sendChat() {
                const text = msgInput.value.trim();
                if (!text) return;
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: "chat", text: text }));
                    appendChatMessage(userName, text, true);
                    msgInput.value = "";
                } else {
                    appendChatMessage("System", "Tafadhali subiri unganisho.", false);
                }
            }

            function appendChatMessage(sender, text, isSelf = false) {
                const div = document.createElement("div");
                div.className = `msg-box${isSelf ? ' self' : ''}`;
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                div.innerHTML = `
                    <div class="msg-sender"><i class="fa-solid fa-user"></i> ${sender}</div>
                    <div>${text}</div>
                    <div class="msg-time">${time}</div>
                `;
                chatMessages.appendChild(div);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // ---- LEAVE ----
            endBtn.onclick = () => {
                if (localStream) localStream.getTracks().forEach(t => t.stop());
                if (socket) socket.close();
                window.location.reload();
            };

            // ---- JOIN ----
            joinBtn.onclick = async () => {
                const val = usernameInput.value.trim();
                if (val) userName = val;
                localNameLabel.textContent = `${userName} (Wewe)`;
                joinModal.style.display = "none";
                await initMedia();
                cameraBtn.classList.add("off");
                cameraBtn.innerHTML = '<i class="fa-solid fa-video-slash"></i>';
                micBtn.classList.add("off");
                micBtn.innerHTML = '<i class="fa-solid fa-microphone-slash"></i>';
                localAvatar.style.display = "flex";
                connectSocket();
            };

            usernameInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter") joinBtn.click();
            });

            localTile.addEventListener("click", function(e) {
                e.stopPropagation();
                toggleZoom(this.id);
            });

            console.log("Live Classroom initialized successfully.");
        })();
    </script>
</body>
</html>
