<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Live Multi-Party Classroom</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh; /* Smooth dynamic viewport height for modern mobile browsers */
            overflow: hidden;
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        
        /* HEADER */
        .header {
            height: 48px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid #334155;
            z-index: 20;
            flex-shrink: 0;
        }
        .logo {
            font-size: 13px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .logo i {
            font-size: 16px;
        }
        .room-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #94a3b8;
        }
        .room-info b {
            color: #e2e8f0;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: inline-block;
            vertical-align: bottom;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #1e293b;
            padding: 3px 8px;
            border-radius: 20px;
            border: 1px solid #334155;
            font-size: 10px;
            white-space: nowrap;
        }
        .dot {
            width: 7px;
            height: 7px;
            background: #ef4444;
            border-radius: 50%;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .dot.online {
            background: #22c55e;
            box-shadow: 0 0 6px #22c55e88;
        }

        /* MAIN CONTAINER */
        .container {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        /* VIDEO GRID */
        .video-grid {
            flex: 1;
            padding: 8px;
            padding-bottom: 70px; /* Space for control bar */
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            grid-auto-rows: minmax(120px, 1fr);
            align-content: center;
            justify-content: center;
            overflow-y: auto;
            background: #0f172a;
            transition: all 0.3s ease;
            width: 100%;
        }
        .video-grid.zoomed {
            grid-template-columns: 1fr !important;
            grid-auto-rows: 1fr !important;
            padding: 4px;
            padding-bottom: 70px;
            gap: 0;
        }
        .video-grid.zoomed .video-card {
            aspect-ratio: auto;
            height: 100%;
            max-height: 100%;
        }
        .video-grid.zoomed .video-card:not(.active-zoom) {
            display: none !important;
        }
        .video-card {
            position: relative;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            aspect-ratio: 4/3;
            width: 100%;
            min-height: 100px;
            cursor: pointer;
            transition: border-color 0.3s, transform 0.2s;
        }
        .video-card:hover {
            border-color: #38bdf8;
        }
        .video-card.active-zoom {
            border-color: #f59e0b;
            border-width: 3px;
        }
        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #0f172a;
            display: block;
        }
        .video-card.local video {
            transform: scaleX(-1);
        }
        .avatar-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            color: #94a3b8;
            z-index: 1;
            gap: 4px;
            font-size: 11px;
            text-align: center;
            padding: 8px;
        }
        .avatar-placeholder i {
            font-size: 32px;
            opacity: 0.7;
        }
        .participant-label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 3px 8px;
            border-radius: 16px;
            font-size: 10px;
            font-weight: 500;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .participant-label i {
            font-size: 9px;
        }
        .hand-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #f59e0b;
            color: #fff;
            border-radius: 50%;
            z-index: 3;
            animation: bounce 0.9s infinite alternate;
            font-size: 11px;
            width: 26px;
            height: 26px;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(245, 158, 11, 0.4);
        }
        .hand-badge.show {
            display: flex;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-4px); }
        }

        /* CHAT SIDEBAR */
        .chat-sidebar {
            width: 320px;
            max-width: 100%;
            background: #1e293b;
            border-left: 1px solid #334155;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 30;
            transform: translateX(100%);
            box-shadow: -8px 0 30px rgba(0, 0, 0, 0.5);
        }
        .chat-sidebar.open {
            transform: translateX(0);
        }
        .chat-header {
            padding: 12px 14px;
            border-bottom: 1px solid #334155;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            flex-shrink: 0;
        }
        .chat-header span {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-header i.fa-xmark {
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .chat-header i.fa-xmark:hover {
            background: #334155;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0f172a;
        }
        .msg-box {
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            border: 1px solid #2d3a4f;
            max-width: 88%;
            word-break: break-word;
            animation: fadeIn 0.2s ease;
        }
        .msg-box.self {
            align-self: flex-end;
            background: #0284c7;
            border-color: #0284c7;
        }
        .msg-box.self .msg-sender {
            color: #b8dfff;
        }
        .msg-sender {
            font-weight: 600;
            font-size: 10px;
            color: #38bdf8;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .msg-sender i {
            font-size: 9px;
        }
        .msg-time {
            font-size: 8px;
            color: #94a3b8;
            margin-top: 2px;
            text-align: right;
            opacity: 0.8;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .chat-input-area {
            padding: 8px 10px;
            border-top: 1px solid #334155;
            display: flex;
            gap: 6px;
            background: #0f172a;
            flex-shrink: 0;
        }
        .chat-input-area input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            padding: 8px 12px;
            border-radius: 30px;
            outline: none;
            font-size: 13px;
            transition: border 0.2s;
            min-height: 38px;
        }
        .chat-input-area input:focus {
            border-color: #0284c7;
        }
        .chat-input-area button {
            background: #0284c7;
            border: none;
            color: #fff;
            padding: 0 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            min-height: 38px;
            flex-shrink: 0;
        }
        .chat-input-area button:hover {
            background: #0369a1;
        }

        /* CONTROLS BAR */
        .controls-wrapper {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: auto;
            max-width: 98%;
        }
        .controls-bar {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 6px 12px;
            border-radius: 50px;
            display: flex;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        .controls-bar.compact {
            padding: 4px 8px;
            gap: 4px;
        }
        .controls-bar.compact .btn-ctrl {
            width: 34px;
            height: 34px;
            font-size: 12px;
        }
        .btn-ctrl {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: #334155;
            color: #f8fafc;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            touch-action: manipulation;
            flex-shrink: 0;
            position: relative;
        }
        .btn-ctrl:active {
            transform: scale(0.92);
        }
        .btn-ctrl:hover {
            background: #475569;
        }
        .btn-ctrl.off {
            background: #ef4444;
            color: white;
        }
        .btn-ctrl.active {
            background: #0284c7;
            color: white;
        }
        .btn-ctrl.danger {
            background: #dc2626;
            color: white;
        }
        .btn-ctrl.danger:hover {
            background: #b91c1c;
        }

        .toggle-controls-btn {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
            touch-action: manipulation;
        }
        .toggle-controls-btn:hover {
            background: rgba(30, 41, 59, 0.95);
            color: #fff;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
        }
        .modal-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 20px 18px;
            border-radius: 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
        }
        .modal-card h2 {
            margin-bottom: 6px;
            color: #38bdf8;
            font-size: 18px;
        }
        .modal-card p {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 16px;
        }
        .modal-card input {
            width: 100%;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 30px;
            color: #fff;
            margin-bottom: 14px;
            outline: none;
            text-align: center;
            font-size: 13px;
            transition: border 0.2s;
        }
        .modal-card input:focus {
            border-color: #38bdf8;
        }
        .btn-join {
            width: 100%;
            padding: 11px;
            background: #0284c7;
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-join:hover {
            background: #0369a1;
        }
        .zoom-hint {
            position: fixed;
            bottom: 72px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 10px;
            color: #94a3b8;
            z-index: 24;
            display: none;
            pointer-events: none;
            border: 1px solid #334155;
            white-space: nowrap;
        }
        .zoom-hint.show {
            display: block;
        }

        /* ===== RESPONSIVE MEDIA QUERIES ===== */
        @media (max-width: 640px) {
            .toggle-controls-btn {
                display: flex;
                align-items: center;
                gap: 4px;
            }
            .chat-sidebar {
                width: 100%;
            }
            .video-grid {
                grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
                grid-auto-rows: minmax(100px, 1fr);
                padding: 6px;
                padding-bottom: 68px;
                gap: 6px;
            }
        }

        @media (max-width: 420px) {
            .header {
                height: 44px;
                padding: 0 8px;
            }
            .logo span {
                display: none; /* Ficha maandishi ya logo kwenye simu ndogo sana */
            }
            .video-grid {
                grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
                grid-auto-rows: minmax(90px, 1fr);
                padding: 4px;
                padding-bottom: 64px;
                gap: 4px;
            }
            .video-card {
                min-height: 85px;
                border-radius: 8px;
            }
            .controls-bar {
                padding: 4px 8px;
                gap: 5px;
            }
            .btn-ctrl {
                width: 36px;
                height: 36px;
                font-size: 13px;
            }
            .controls-bar.compact .btn-ctrl {
                width: 30px;
                height: 30px;
                font-size: 11px;
            }
            .zoom-hint {
                bottom: 62px;
                font-size: 9px;
            }
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar,
        .video-grid::-webkit-scrollbar {
            width: 3px;
        }
        .chat-messages::-webkit-scrollbar-track,
        .video-grid::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb,
        .video-grid::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- JOIN MODAL -->
    <div id="joinModal" class="modal-overlay">
        <div class="modal-card">
            <h2><i class="fa-solid fa-graduation-cap" style="color:#38bdf8;"></i> Live Classroom</h2>
            <p>Ingiza jina lako ili kujiunga</p>
            <input type="text" id="usernameInput" placeholder="Jina lako, e.g. Elia Mhapa" autofocus />
            <button id="joinBtn" class="btn-join"><i class="fa-solid fa-right-to-bracket"></i> Jiunge Sasa</button>
        </div>
    </div>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-chalkboard-user"></i>
            <span>Classroom</span>
        </div>
        <div class="room-info">
            <span>Room: <b id="roomLabel">...</b></span>
            <div class="status-badge">
                <span id="statusDot" class="dot"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </div>
    </header>

    <!-- VIDEO GRID + CHAT -->
    <div class="container">
        <div id="videoGrid" class="video-grid">
            <!-- Local tile -->
        </div>
        <div id="chatSidebar" class="chat-sidebar">
            <div class="chat-header">
                <span><i class="fa-solid fa-comments"></i> Chat</span>
                <i id="closeChatBtn" class="fa-solid fa-xmark"></i>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="msgInput" placeholder="Andika ujumbe..." />
                <button id="sendMsgBtn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- ZOOM HINT -->
    <div id="zoomHint" class="zoom-hint">Bonyeza tile kuizoom • Bonyeza tena kurudi</div>

    <!-- CONTROLS WRAPPER -->
    <div class="controls-wrapper">
        <button id="toggleControlsBtn" class="toggle-controls-btn">
            <i class="fa-solid fa-chevron-left"></i> Compact
        </button>
        <div id="controlsBar" class="controls-bar">
            <button id="micBtn" class="btn-ctrl off" title="Mic">
                <i class="fa-solid fa-microphone-slash"></i>
            </button>
            <button id="cameraBtn" class="btn-ctrl off" title="Camera">
                <i class="fa-solid fa-video-slash"></i>
            </button>
            <button id="handBtn" class="btn-ctrl" title="Hand">
                <i class="fa-solid fa-hand"></i>
            </button>
            <button id="chatBtn" class="btn-ctrl" title="Chat">
                <i class="fa-solid fa-message"></i>
            </button>
            <button id="endBtn" class="btn-ctrl danger" title="Leave">
                <i class="fa-solid fa-phone-slash"></i>
            </button>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            const videoGrid = document.getElementById("videoGrid");
            const joinModal = document.getElementById("joinModal");
            const joinBtn = document.getElementById("joinBtn");
            const usernameInput = document.getElementById("usernameInput");
            const roomLabel = document.getElementById("roomLabel");
            const statusDot = document.getElementById("statusDot");
            const statusText = document.getElementById("statusText");
            const micBtn = document.getElementById("micBtn");
            const cameraBtn = document.getElementById("cameraBtn");
            const handBtn = document.getElementById("handBtn");
            const chatBtn = document.getElementById("chatBtn");
            const endBtn = document.getElementById("endBtn");
            const chatSidebar = document.getElementById("chatSidebar");
            const closeChatBtn = document.getElementById("closeChatBtn");
            const chatMessages = document.getElementById("chatMessages");
            const msgInput = document.getElementById("msgInput");
            const sendMsgBtn = document.getElementById("sendMsgBtn");
            const zoomHint = document.getElementById("zoomHint");
            const controlsBar = document.getElementById("controlsBar");
            const toggleBtn = document.getElementById("toggleControlsBtn");

            // Create local tile
            const localTile = document.createElement("div");
            localTile.id = "localTile";
            localTile.className = "video-card local";
            localTile.dataset.userId = "local";
            localTile.dataset.userName = "Wewe";
            localTile.innerHTML = `
                <div id="localAvatar" class="avatar-placeholder">
                    <i class="fa-solid fa-user-slash"></i>
                    <span>Kamera Iko Off</span>
                </div>
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="participant-label">
                    <i class="fa-solid fa-user"></i>
                    <span id="localNameLabel">Wewe</span>
                </div>
                <div id="localHand" class="hand-badge">
                    <i class="fa-solid fa-hand"></i>
                </div>
            `;
            videoGrid.appendChild(localTile);

            const localVideo = document.getElementById("localVideo");
            const localAvatar = document.getElementById("localAvatar");
            const localNameLabel = document.getElementById("localNameLabel");
            const localHand = document.getElementById("localHand");

            // State
            const params = new URLSearchParams(window.location.search);
            const room = params.get("room") || "class1";
            roomLabel.textContent = room;

            const userId = "user_" + Math.random().toString(36).substr(2, 9);
            let userName = "Participant";
            let socket = null;
            let localStream = null;
            let isCameraOn = false;
            let isMicOn = false;
            let isHandRaised = false;
            let isZoomed = false;
            let zoomedTileId = null;
            let isCompact = false;
            const peerConnections = new Map();

            const rtcConfig = {
                iceServers: [
                    { urls: "stun:stun.l.google.com:19302" },
                    { urls: "stun:stun1.l.google.com:19302" }
                ]
            };

            // ---- TOGGLE CONTROLS ----
            toggleBtn.addEventListener("click", function() {
                isCompact = !isCompact;
                controlsBar.classList.toggle("compact", isCompact);
                if (isCompact) {
                    toggleBtn.innerHTML = '<i class="fa-solid fa-chevron-right"></i> Expand';
                } else {
                    toggleBtn.innerHTML = '<i class="fa-solid fa-chevron-left"></i> Compact';
                }
            });

            // ---- ZOOM FUNCTIONALITY ----
            videoGrid.addEventListener("click", function(e) {
                const card = e.target.closest(".video-card");
                if (!card) return;

                if (isZoomed && card.classList.contains("active-zoom")) {
                    // Reset zoom
                    videoGrid.classList.remove("zoomed");
                    card.classList.remove("active-zoom");
                    isZoomed = false;
                    zoomedTileId = null;
                    zoomHint.classList.remove("show");
                } else {
                    // Apply zoom
                    document.querySelectorAll(".video-card").forEach(c => c.classList.remove("active-zoom"));
                    videoGrid.classList.add("zoomed");
                    card.classList.add("active-zoom");
                    isZoomed = true;
                    zoomedTileId = card.id;
                    zoomHint.classList.add("show");
                }
            });

            // ---- CHAT SIDEBAR TOGGLE ----
            chatBtn.addEventListener("click", function() {
                chatSidebar.classList.toggle("open");
            });
            closeChatBtn.addEventListener("click", function() {
                chatSidebar.classList.remove("open");
            });

            // JOIN EVENT
            joinBtn.addEventListener("click", function() {
                const name = usernameInput.value.trim();
                if (name) {
                    userName = name;
                    localNameLabel.textContent = userName + " (Wewe)";
                }
                joinModal.style.display = "none";
            });

            // HAND RAISE TOGGLE
            handBtn.addEventListener("click", function() {
                isHandRaised = !isHandRaised;
                localHand.classList.toggle("show", isHandRaised);
                handBtn.classList.toggle("active", isHandRaised);
            });

        })();
    </script>
</body>
</html>
